<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .tile {
      fill: #593f39;
    }
    .letter {
      fill: #f2f2f2;
    }
    @media (prefers-color-scheme: dark) {
      .tile {
        fill: #c4ddf2;
      }
      .letter {
        fill: #2a1f1c;
      }
    }
  </style>
  <rect class="tile" width="64" height="64" rx="16" />
  <text
    class="letter"
    x="32"
    y="45"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="38"
    font-weight="700"
  >B</text>
</svg>
